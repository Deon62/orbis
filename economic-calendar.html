<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Economic calendar · orbisflow</title>
<meta name="description" content="Scheduled releases that move the markets.">
<meta name="theme-color" content="#1C1C1C">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin>
<link rel="preload" as="script" href="/assets/js/app.js">
<link rel="preload" as="script" href="/assets/js/data.js">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem("orbisflow-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="economic-calendar" data-title="Economic calendar" data-tabbar="hide" data-shell="app">

<div id="site-header"></div>

<main class="wrap page-body">
  <div class="toolbar" style="padding-top:0">
    <div class="fdrop" data-fdrop>
      <button class="fdrop-btn" aria-haspopup="listbox" aria-expanded="false"><span class="fdrop-val">Today</span><i data-lucide="chevron-down" class="i-sm chev"></i></button>
      <div class="fdrop-menu" hidden role="listbox">
        <button class="fdrop-opt" role="option" data-v="today" aria-selected="true"><span class="fdrop-tx">Today</span></button>
        <button class="fdrop-opt" role="option" data-v="tomorrow" aria-selected="false"><span class="fdrop-tx">Tomorrow</span></button>
        <button class="fdrop-opt" role="option" data-v="week" aria-selected="false"><span class="fdrop-tx">This week</span></button>
      </div>
    </div>
    <span class="grow"></span>
    <span class="dim" style="font-size:12.5px">All times UTC · actual vs forecast</span>
  </div>

  <div class="card card-flat" id="calList"></div>
</main>

<script src="/assets/js/icons.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/chart.js"></script>
<script src="/assets/js/data.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/qr.js"></script>
<script src="/assets/js/modals.js"></script>

<script>
(function () {
  var A = OrbisAPI, M = A.money;

  var WHEN = { today: 'today', tomorrow: 'tomorrow', week: 'this week' };
  function load(range) {
    A.load({
      el: '#calList', path: '/calendar?range=' + range,
      empty: { icon: 'calendar-days', title: 'No events ' + WHEN[range],
        text: 'Rate decisions, inflation and jobs data show here with their forecast, previous and actual figures.' },
      render: function (d) {
        return '<div class="tbl-scroll"><table class="tbl" style="min-width:760px"><thead><tr><th>Time</th><th>Currency</th><th>Event</th><th>Impact</th><th class="r">Forecast</th><th class="r">Previous</th><th class="r">Actual</th></tr></thead><tbody>' +
          d.map(function (e) {
            return '<tr><td><span class="mono">' + e.time + '</span></td>' +
              '<td>' + (e.flag ? '<img src="https://flagcdn.com/w40/' + e.flag + '.png" alt="" class="acct-flag" style="width:18px;height:18px"> ' : '') + e.ccy + '</td>' +
              '<td><b>' + e.event + '</b></td><td><span class="imp imp-' + String(e.impact).toLowerCase() + '">' + e.impact + '</span></td>' +
              '<td class="r mono fc">' + (e.forecast || '-') + '</td><td class="r mono dim">' + (e.previous || '-') + '</td><td class="r mono">' + (e.actual || '-') + '</td></tr>';
          }).join('') + '</tbody></table></div>';
      }
    });
  }
  document.addEventListener('fdrop:change', function (e) { load(e.detail.value); });
  load('today');
})();
</script>
</body>
</html>
