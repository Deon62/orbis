<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contact us · orbisflow</title>
<meta name="description" content="Reach the team.">
<meta name="theme-color" content="#1C1C1C">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin>
<link rel="preload" as="script" href="/assets/js/app.js">
<link rel="preload" as="script" href="/assets/js/data.js">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem("orbisflow-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="contact" data-title="Contact us" data-tabbar="hide" data-shell="app">

<div id="site-header"></div>

<main class="wrap page-body">
  <div class="list">
    <a class="link-row" href="/live-chat">
      <span class="lr-ic"><i data-lucide="message-square" class="i"></i></span>
      <span class="lr-tx"><b>Live chat</b><span>Fastest · 24/7</span></span>
      <i data-lucide="chevron-right" class="i-sm dim"></i>
    </a>
    <a class="link-row" href="#" data-mock="Email support">
      <span class="lr-ic"><i data-lucide="mail" class="i"></i></span>
      <span class="lr-tx"><b>Email</b><span>support@orbisflow.com · within 12 hours</span></span>
      <i data-lucide="chevron-right" class="i-sm dim"></i>
    </a>
    <a class="link-row" href="#" data-mock="Phone support">
      <span class="lr-ic"><i data-lucide="phone" class="i"></i></span>
      <span class="lr-tx"><b>Phone</b><span>+254 20 000 0000 · 08:00-20:00 EAT</span></span>
      <i data-lucide="chevron-right" class="i-sm dim"></i>
    </a>
    <a class="link-row" href="#" data-mock="Office address">
      <span class="lr-ic"><i data-lucide="map-pin" class="i"></i></span>
      <span class="lr-tx"><b>Office</b><span>Westlands, Nairobi, Kenya</span></span>
      <i data-lucide="chevron-right" class="i-sm dim"></i>
    </a>
  </div>
</main>

<script src="/assets/js/icons.js"></script>
<script src="/assets/js/chart.js"></script>
<script src="/assets/js/data.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/modals.js"></script>

</body>
</html>
