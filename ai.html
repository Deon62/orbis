<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI · obisflow</title>
<meta name="description" content="AI signals and market read.">
<meta name="theme-color" content="#1C1C1C">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin>
<link rel="preload" as="script" href="/assets/js/app.js">
<link rel="preload" as="script" href="/assets/js/data.js">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem("orbisflow-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="ai" data-hdr-action="market-read" data-hdr-icon="info" data-hdr-label="Market read" data-shell="app">

<div id="site-header"></div>

<main class="wrap page-body">
  <div class="ai-scan">
    <div class="ai-hero">
      <span class="ai-hero-ic"><i data-lucide="radar"></i></span>
      <h1>Market scan</h1>
      <p>Finds the markets moving most clearly in the last 15 minutes.</p>
      <button class="btn btn-primary btn-lg" id="rescan">
        <i data-lucide="radar" class="i-sm"></i><span id="rescanTx">Scan the markets</span>
      </button>
      <span class="scan-at" id="scanAt"></span>
    </div>

    <div id="signals"></div>

    <p class="ai-note">
      <i data-lucide="info" class="i-sm"></i>
      <span>A reading of recent price movement, not a prediction. obisflow's prices are generated, so how a market has just moved does not tell you its next move.</span>
    </p>
  </div>
</main>

<script src="/assets/js/icons.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/chart.js"></script>
<script src="/assets/js/data.js"></script>
<script src="/assets/js/ai-engine.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/qr.js"></script>
<script src="/assets/js/modals.js"></script>
<script>
(function () {
  var A = OrbisAPI;
  var KEY = 'obisflow-ai-scan';
  var last = null;
  var grid = document.getElementById('signals');
  var btn = document.getElementById('rescan');
  var btnTx = document.getElementById('rescanTx');
  var at = document.getElementById('scanAt');

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  /* The API answers with the strongest markets whenever its price feed is up.
     A first scan can land while the server is waking, so it is asked again,
     up to four times, before giving up. Without an API (local preview) the
     stand-in engine answers. */
  function fetchScan(attempt) {
    attempt = attempt || 0;
    if (!A.connected) return OrbisAIEngine.scan(function (step) { at.textContent = step + '…'; });
    at.textContent = attempt ? 'Waking the scanner…' : 'Reading the markets…';
    return A.get('/signals?limit=6').then(function (rows) {
      if (rows && rows.length) return { signals: rows, scannedAt: Date.now() };
      throw new Error('empty');
    }).catch(function (e) {
      if (attempt >= 3) throw e;
      return wait(1500 * (attempt + 1)).then(function () { return fetchScan(attempt + 1); });
    });
  }

  function ago(t) {
    var m = Math.round((Date.now() - t) / 60000);
    return m < 1 ? 'Scanned just now' : 'Scanned ' + m + ' min ago';
  }

  function draw() {
    if (!last) { grid.innerHTML = ''; return; }
    grid.innerHTML = '<div class="grid g3">' + last.signals.map(function (s, i) {
      var m = OrbisData.bySymbol(s.sym) || { sym: s.sym, name: '', icon: {} };
      var up = s.dir === 'Rise';
      var strength = s.strength != null ? s.strength : s.conf;
      return '<div class="signal sig-in" style="animation-delay:' + (i * 60) + 'ms"><div class="signal-hd">' + OrbisData.assetHTML(m) +
        '<span class="nm"><b>' + s.sym + '</b><span>' + (s.price ? s.price : s.tf + ' contract') + '</span></span>' +
        '<span class="tag ' + (up ? 'tag-up' : 'tag-down') + '"><i data-lucide="' + (up ? 'trending-up' : 'trending-down') + '" class="i-sm"></i>' + (up ? 'Buy' : 'Sell') + '</span></div>' +
        '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3)"><span>Strength of the move</span><b class="mono" style="color:var(--ink)">' + strength + '</b></div>' +
        '<div class="conf"><i style="width:' + strength + '%;background:' + (up ? 'var(--up)' : 'var(--down)') + '"></i></div>' +
        '<p>' + s.why + '</p>' +
        '<a class="btn btn-ghost btn-sm btn-block" style="margin-top:12px" href="/trade?symbol=' + encodeURIComponent(s.sym) +
          '&dir=' + s.dir + '&tf=' + s.tf + '">Open on the chart<i data-lucide="arrow-right" class="i-sm"></i></a></div>';
    }).join('') + '</div>';
    window.orbisIcons();
  }

  function paintAt() { at.textContent = last ? ago(last.scannedAt) : ''; }

  function scan() {
    if (btn.disabled) return;
    var done = window.orbisBusy ? window.orbisBusy(btn, 'Scanning') : function () {};
    grid.classList.add('scanning');
    if (!last) grid.innerHTML = A.loading(3);
    fetchScan().then(function (r) {
      last = r;
      try { sessionStorage.setItem(KEY, JSON.stringify(r)); } catch (e) {}
    }).catch(function () {
      window.orbisToast('The scanner is not answering right now. Try again in a minute.', 'triangle-alert');
    }).then(function () {
      done();
      btnTx.textContent = last ? 'Scan again' : 'Scan the markets';
      grid.classList.remove('scanning');
      draw(); paintAt();
    });
  }

  btn.addEventListener('click', scan);

  /* a scan from the last ten minutes survives moving between pages */
  try {
    var saved = JSON.parse(sessionStorage.getItem(KEY));
    if (saved && saved.signals && saved.signals.length && Date.now() - saved.scannedAt < 10 * 60000) {
      last = saved; btnTx.textContent = 'Scan again';
    }
  } catch (e) {}
  draw(); paintAt();
  setInterval(paintAt, 30000);
})();
</script>
</body>
</html>
