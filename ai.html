<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI · orbisflow</title>
<meta name="description" content="AI signals and market read.">
<meta name="theme-color" content="#1C1C1C">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin>
<link rel="preload" as="script" href="/assets/js/app.js">
<link rel="preload" as="script" href="/assets/js/data.js">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem("orbisflow-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="ai" data-hdr-action="market-read" data-hdr-icon="info" data-hdr-label="Market read" data-shell="app">

<div id="site-header"></div>

<main class="wrap page-body">
  <div class="stack">

    <!-- signals --------------------------------------------------------- -->
    <div>
      <div class="toolbar" style="border-bottom:0;padding-top:0">
        <div class="fdrop" data-fdrop>
      <button class="fdrop-btn" aria-haspopup="listbox" aria-expanded="false"><span class="fdrop-lbl">Showing</span><span class="fdrop-val">All signals</span><i data-lucide="chevron-down" class="i-sm chev"></i></button>
      <div class="fdrop-menu" hidden role="listbox">
        <button class="fdrop-opt" role="option" data-v="all" aria-selected="true"><span class="fdrop-tx">All signals</span></button>
        <button class="fdrop-opt" role="option" data-v="Rise" aria-selected="false"><span class="fdrop-tx"><i data-lucide="arrow-up" class="i-sm"></i>Rise only</span></button>
        <button class="fdrop-opt" role="option" data-v="Fall" aria-selected="false"><span class="fdrop-tx"><i data-lucide="arrow-down" class="i-sm"></i>Fall only</span></button>
      </div>
    </div>
        <span class="grow"></span>
        <button class="btn btn-primary btn-sm" id="rescan">
          <i data-lucide="radar" class="i-sm"></i><span id="rescanTx">Rescan</span>
        </button>
      </div>
      <div id="signals"></div>
    </div>

    <!-- pattern watch ---------------------------------------------------- -->
    <div class="card card-flat">
      <div class="card-hd"><h3>Pattern watch</h3><span class="dim" style="font-size:12.5px">Detected in the last hour</span></div>
      <div id="patterns"></div>
    </div>

    <p class="ai-note">
      <i data-lucide="info" class="i-sm"></i>
      <span>Signals are model output, not advice. They are wrong roughly a third of the time.</span>
    </p>
  </div>
</main>

<script src="/assets/js/icons.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/chart.js"></script>
<script src="/assets/js/data.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/qr.js"></script>
<script src="/assets/js/modals.js"></script>
<script>
(function () {
  var A = OrbisAPI, M = A.money;

  var filter = 'all', signals = [];
  var grid = document.getElementById('signals');
  var scanBtn = document.getElementById('rescan');

  function cards() {
    var rows = signals.filter(function (s) { return filter === 'all' || s.dir === filter; });
    if (!rows.length) {
      grid.innerHTML = A.empty({ icon: 'radar', title: 'No ' + (filter === 'all' ? '' : filter.toLowerCase() + ' ') + 'signals right now',
        text: 'The model only calls a setup when it clears its confidence bar. Rescan in a few minutes.' });
      return window.orbisIcons();
    }
    grid.innerHTML = '<div class="grid g3">' + rows.map(function (s) {
      var m = OrbisData.bySymbol(s.sym) || { sym: s.sym, name: '', icon: {} };
      var up = s.dir === 'Rise';
      return '<div class="signal"><div class="signal-hd">' + OrbisData.assetHTML(m) +
        '<span class="nm"><b>' + s.sym + '</b><span>' + s.tf + ' contract · $' + s.stake + '</span></span>' +
        '<span class="tag ' + (up ? 'tag-up' : 'tag-down') + '"><i data-lucide="' + (up ? 'trending-up' : 'trending-down') + '" class="i-sm"></i>' + s.dir + '</span></div>' +
        '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3)"><span>Confidence</span><b class="mono" style="color:var(--ink)">' + s.conf + '%</b></div>' +
        '<div class="conf"><i style="width:' + s.conf + '%;background:' + (up ? 'var(--up)' : 'var(--down)') + '"></i></div>' +
        '<p>' + s.why + '</p>' +
        '<a class="btn btn-ghost btn-sm btn-block" style="margin-top:12px" href="/trade?symbol=' + encodeURIComponent(s.sym) +
          '&dir=' + s.dir + '&tf=' + s.tf + '&stake=' + s.stake + '">Trade this signal<i data-lucide="arrow-right" class="i-sm"></i></a></div>';
    }).join('') + '</div>';
    window.orbisIcons();
  }

  function loadSignals() {
    grid.innerHTML = A.loading(3);
    return A.get('/signals').then(function (d) { signals = d || []; cards(); })
      .catch(function () { signals = []; cards(); });
  }

  function loadPatterns() {
    return A.load({
      el: '#patterns', path: '/patterns',
      empty: { icon: 'chart-candlestick', title: 'No patterns in the last hour',
        text: 'Double tops, flags and breakouts show here as the scanner finds them.' },
      render: function (d) {
        return '<div class="tbl-scroll"><table class="tbl"><thead><tr><th>Market</th><th>Pattern</th><th>Timeframe</th><th>Bias</th><th class="r">Detected</th></tr></thead><tbody>' +
          d.map(function (r) {
            var up = r.bias === 'Rise';
            return '<tr><td><b>' + r.sym + '</b></td><td>' + r.pattern + '</td><td class="mono">' + r.tf + '</td>' +
              '<td><span class="tag ' + (up ? 'tag-up' : 'tag-down') + '">' + r.bias + '</span></td><td class="r dim">' + r.ago + '</td></tr>';
          }).join('') + '</tbody></table></div>';
      }
    });
  }

  document.addEventListener('fdrop:change', function (e) { filter = e.detail.value; cards(); });

  scanBtn.addEventListener('click', function () {
    if (scanBtn.disabled) return;
    scanBtn.disabled = true;
    scanBtn.querySelector('#rescanTx').textContent = 'Scanning';
    var svg = scanBtn.querySelector('svg'); if (svg) svg.classList.add('spin');
    Promise.all([loadSignals(), loadPatterns()]).then(function () {
      scanBtn.disabled = false;
      scanBtn.querySelector('#rescanTx').textContent = 'Rescan';
      var svg = scanBtn.querySelector('svg'); if (svg) svg.classList.remove('spin');
      window.orbisToast(signals.length ? 'Scan complete · ' + signals.length + ' signals' : 'Scan complete · no signals right now', 'radar');
    });
  });

  loadSignals();
  loadPatterns();
})();
</script>
</body>
</html>
