<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Referral earnings · orbisflow</title>
<meta name="description" content="Referral payouts and accruals.">
<meta name="theme-color" content="#1C1C1C">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin>
<link rel="preload" as="script" href="/assets/js/app.js">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem("orbisflow-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="referral-earnings" data-nav="account" data-title="Referral earnings" data-back-to="/trade" data-tabbar="hide" data-shell="app">

<div id="site-header"></div>

<main class="wrap page-body">
  <div class="stack" style="max-width:780px">

    <!-- part-to-whole with two parts: a stacked bar reads it better than a
         two-slice donut, where the 6% pending share is a sliver -->
    <figure class="viz">
      <figcaption class="viz-hd">
        <span class="viz-label">Total accrued</span>
        <b class="viz-hero mono" id="reTotal">$0.00</b>
      </figcaption>
      <div class="sbar" role="img" id="reBar" aria-label="Nothing accrued yet"></div>
      <div class="viz-legend">
        <span class="viz-key"><i class="sw sw-1"></i>Paid<b class="mono" id="rePaid">$0.00</b></span>
        <span class="viz-key"><i class="sw sw-2"></i>Pending<b class="mono" id="rePending">$0.00</b></span>
      </div>
    </figure>

    <div class="card card-flat" id="reList"></div>
  </div>
</main>

<script src="/assets/js/icons.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/qr.js"></script>
<script src="/assets/js/qr.js"></script>
<script src="/assets/js/modals.js"></script>
<script>
(function () {
  var A = OrbisAPI, M = A.money;

  A.load({
    el: '#reList', path: '/referrals/earnings',
    empty: { icon: 'banknote', title: 'No earnings yet',
      text: 'When your referrals trade, your share builds up each week and is paid every Thursday.',
      action: '<a class="btn btn-ghost btn-sm" href="/referral-how">How referrals pay</a>' },
    render: function (d) {
      var paid = d.paid || 0, pending = d.pending || 0, total = paid + pending;
      var pp = total ? Math.round(paid / total * 100) : 0;
      document.getElementById('reTotal').textContent = M(total);
      document.getElementById('rePaid').textContent = M(paid);
      document.getElementById('rePending').textContent = M(pending);
      var bar = document.getElementById('reBar');
      bar.setAttribute('aria-label', 'Paid ' + M(paid) + ', ' + pp + ' percent. Pending ' + M(pending) + ', ' + (100 - pp) + ' percent.');
      bar.innerHTML = total ? '<span class="sbar-seg seg-1" style="width:' + pp + '%" data-tip="Paid · ' + M(paid) + ' · ' + pp + '%"></span>' +
        '<span class="sbar-seg seg-2" style="width:' + (100 - pp) + '%" data-tip="Pending · ' + M(pending) + ' · ' + (100 - pp) + '%"></span>' : '';
      return '<div class="tbl-scroll"><table class="tbl"><thead><tr><th>Period</th><th>Active traders</th><th class="r">Volume</th><th class="r">Amount</th><th>Status</th></tr></thead><tbody>' +
        (d.weeks || []).map(function (w) {
          var paidRow = w.status === 'Paid';
          return '<tr><td>' + w.period + '</td><td class="num">' + w.active + '</td><td class="r mono">' + M(w.volume) + '</td>' +
            '<td class="r mono ' + (paidRow ? 'up' : '') + '">' + M(w.amount) + '</td><td><span class="tag ' + (paidRow ? 'tag-up' : 'tag-wait') + '">' + w.status + '</span></td></tr>';
        }).join('') + '</tbody></table></div>';
    }
  });
})();
</script>
<script>
/* per-segment tooltip, delegated because the segments arrive with the data */
(function () {
  var tip, bar = document.getElementById('reBar');
  bar.addEventListener('pointerover', function (e) {
    var seg = e.target.closest('.sbar-seg');
    if (!seg) return;
    tip = tip || Object.assign(document.createElement('div'), { className: 'viz-tip' });
    tip.textContent = seg.dataset.tip;
    document.body.appendChild(tip);
    var r = seg.getBoundingClientRect();
    tip.style.left = Math.round(r.left + r.width / 2) + 'px';
    tip.style.top = Math.round(r.top + window.scrollY - 10) + 'px';
    tip.classList.add('show');
  });
  bar.addEventListener('pointerleave', function () { if (tip) tip.classList.remove('show'); });
})();
</script>
</body>
</html>
