<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Referral earnings · orbisflow</title>
<meta name="description" content="Referral payouts and accruals.">
<meta name="theme-color" content="#1C1C1C">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin>
<link rel="preload" as="script" href="/assets/js/app.js">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script>(function(){try{var t=localStorage.getItem("orbisflow-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="referral-earnings" data-nav="account" data-title="Referral earnings" data-back-to="/trade" data-tabbar="hide" data-shell="app">

<div id="site-header"></div>

<main class="wrap page-body">
  <div class="stack" style="max-width:780px">

    <!-- part-to-whole with two parts: a stacked bar reads it better than a
         two-slice donut, where the 6% pending share is a sliver -->
    <figure class="viz">
      <figcaption class="viz-hd">
        <span class="viz-label">Total accrued</span>
        <b class="viz-hero mono">$1,496.70</b>
      </figcaption>

      <div class="sbar" role="img"
           aria-label="Paid $1,406.80, 94 percent. Pending $89.90, 6 percent.">
        <span class="sbar-seg seg-1" style="width:94%" data-tip="Paid · $1,406.80 · 94%"></span>
        <span class="sbar-seg seg-2" style="width:6%"  data-tip="Pending · $89.90 · 6%"></span>
      </div>

      <div class="viz-legend">
        <span class="viz-key"><i class="sw sw-1"></i>Paid<b class="mono">$1,406.80</b></span>
        <span class="viz-key"><i class="sw sw-2"></i>Pending<b class="mono">$89.90</b></span>
      </div>
    </figure>

    <div class="card card-flat">
      <div class="tbl-scroll">
        <table class="tbl">
          <thead>
            <tr><th>Period</th><th>Active traders</th><th class="r">Volume</th><th class="r">Amount</th><th>Status</th></tr>
          </thead>
          <tbody>
            <tr><td>15-21 Sep 2026</td><td class="num">21</td><td class="r mono">$34,180.00</td><td class="r mono">$89.90</td><td><span class="tag tag-wait">Pending</span></td></tr>
            <tr><td>8-14 Sep 2026</td><td class="num">19</td><td class="r mono">$28,640.00</td><td class="r mono up">$74.20</td><td><span class="tag tag-up">Paid</span></td></tr>
            <tr><td>1-7 Sep 2026</td><td class="num">16</td><td class="r mono">$22,910.00</td><td class="r mono up">$61.40</td><td><span class="tag tag-up">Paid</span></td></tr>
            <tr><td>25-31 Aug 2026</td><td class="num">14</td><td class="r mono">$19,480.00</td><td class="r mono up">$52.10</td><td><span class="tag tag-up">Paid</span></td></tr>
            <tr><td>18-24 Aug 2026</td><td class="num">11</td><td class="r mono">$15,220.00</td><td class="r mono up">$40.80</td><td><span class="tag tag-up">Paid</span></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script src="/assets/js/icons.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/qr.js"></script>
<script src="/assets/js/qr.js"></script>
<script src="/assets/js/modals.js"></script>
<script>
/* per-segment tooltip, the hover layer a chart is expected to carry */
(function () {
  var tip;
  document.querySelectorAll('.sbar-seg').forEach(function (seg) {
    seg.addEventListener('pointerenter', function () {
      tip = tip || Object.assign(document.createElement('div'), { className: 'viz-tip' });
      tip.textContent = seg.dataset.tip;
      document.body.appendChild(tip);
      var r = seg.getBoundingClientRect();
      tip.style.left = Math.round(r.left + r.width / 2) + 'px';
      tip.style.top = Math.round(r.top + window.scrollY - 10) + 'px';
      tip.classList.add('show');
    });
    seg.addEventListener('pointerleave', function () { if (tip) tip.classList.remove('show'); });
  });
})();
</script>
</body>
</html>
