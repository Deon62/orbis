<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Watchlists · orbisflow</title>
<meta name="description" content="The markets you are keeping an eye on.">
<meta name="theme-color" content="#1C1C1C">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem("orbisflow-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="watchlists" data-title="Watchlists" data-tabbar="hide" data-shell="app">

<div id="site-header"></div>

<main class="wrap page-body">
  <div class="toolbar" style="padding-top:0">
    <div class="fdrop" data-fdrop>
      <button class="fdrop-btn" aria-haspopup="listbox" aria-expanded="false"><span class="fdrop-val">Default</span><i data-lucide="chevron-down" class="i-sm chev"></i></button>
      <div class="fdrop-menu" hidden role="listbox">
        <button class="fdrop-opt" role="option" data-v="default" aria-selected="true"><span class="fdrop-tx">Default</span></button>
        <button class="fdrop-opt" role="option" data-v="crypto" aria-selected="false"><span class="fdrop-tx">Crypto</span></button>
      </div>
    </div>
    <span class="grow"></span>
    <button class="btn btn-ghost btn-sm" data-mock="New watchlist"><i data-lucide="plus" class="i-sm"></i>New</button>
  </div>

  <div class="card card-flat" id="wlist"></div>
</main>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="/assets/js/chart.js"></script>
<script src="/assets/js/data.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/modals.js"></script>
<script>
document.getElementById('wlist').innerHTML =
  ['EUR/USD','BTC/USD','XAU/USD','US 100','Volatility 75']
    .map(function (s, i) { return OrbisData.rowHTML(OrbisData.bySymbol(s), i); }).join('');
OrbisData.drawSparklines();
window.orbisIcons();
</script>
</body>
</html>
