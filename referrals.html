<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your referrals · orbisflow</title>
<meta name="description" content="Everyone you have referred.">
<meta name="theme-color" content="#1C1C1C">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin>
<link rel="preload" as="script" href="/assets/js/app.js">
<link rel="preload" as="script" href="/assets/js/data.js">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem("orbisflow-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="referrals" data-nav="account" data-title="Your referrals" data-back-to="/trade" data-tabbar="hide" data-shell="app">

<div id="site-header"></div>

<main class="wrap page-body">
  <div class="card card-flat" style="max-width:780px" id="refList"></div>
</main>

<script src="/assets/js/icons.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/chart.js"></script>
<script src="/assets/js/data.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/qr.js"></script>
<script src="/assets/js/modals.js"></script>
<script>
(function () {
  var A = OrbisAPI, M = A.money;

  A.load({
    el: '#refList', path: '/referrals',
    empty: { icon: 'users', title: 'No referrals yet',
      text: 'Share your link. Everyone who signs up with it shows here, with what they trade and what you earn.',
      action: '<button class="btn btn-primary btn-sm" data-modal="refer">Share your link</button> <a class="btn btn-ghost btn-sm" href="/referral-how">How it works</a>' },
    render: function (d) {
      return '<div class="tbl-scroll"><table class="tbl"><thead><tr><th>User</th><th>Joined</th><th>Status</th><th class="r">Volume</th><th class="r">Earned</th></tr></thead><tbody>' +
        d.map(function (r) {
          var cls = r.status === 'Active' ? 'tag-up' : (r.status === 'Pending' ? 'tag-wait' : '');
          return '<tr><td class="mono">' + r.user + '</td><td class="dim">' + r.joined + '</td><td><span class="tag ' + cls + '">' + r.status + '</span></td>' +
            '<td class="r mono">' + M(r.volume) + '</td><td class="r mono ' + (r.earned > 0 ? 'up' : 'dim') + '">' + M(r.earned) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }
  });
})();
</script>
</body>
</html>
