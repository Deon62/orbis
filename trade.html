<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trade · orbisflow</title>
<meta name="description" content="The orbisflow trade terminal.">
<meta name="theme-color" content="#1C1C1C">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin>
<link rel="preload" as="script" href="/assets/js/app.js">
<link rel="preload" as="script" href="/assets/js/data.js">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem("orbisflow-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="trade" data-shell="app">

<div id="site-header"></div>

<main class="wrap" style="padding-top:12px;padding-bottom:28px">
  <div class="terminal">

    <!-- ===================================================== chart ----- -->
    <section class="chart-panel">
      <div class="chart-top">
        <div class="mkt-picker" id="picker">
          <button class="mkt-trigger" id="pickBtn" aria-haspopup="listbox" aria-expanded="false">
            <span id="pickMark"></span>
            <span class="nm"><b id="pickSym">EUR/USD</b><span id="pickCat">Forex</span></span>
            <i data-lucide="chevron-down" class="i-sm"></i>
          </button>
          <div class="mkt-menu" id="pickMenu" hidden role="listbox" aria-label="Markets"></div>
        </div>
        <div class="sym-price">
          <b class="mono" id="price">1.08420</b>
          <span id="chg" class="up">+0.18%</span>
        </div>
      </div>

      <div class="tf" role="group" aria-label="Duration">
        <button>1t</button><button>15s</button><button class="active">1m</button>
        <button>5m</button><button>15m</button><button>1h</button><button>1d</button>
        <span class="tf-sep"></span>
        <button class="tf-tool" id="typeBtn" aria-label="Chart type"><i data-lucide="chart-candlestick" class="i"></i></button>
        <button class="tf-tool" data-modal="indicators" aria-label="Indicators"><i data-lucide="sliders-horizontal" class="i"></i></button>
        <button class="tf-tool" id="fullBtn" aria-label="Fullscreen chart"><i data-lucide="maximize-2" class="i"></i></button>
      </div>

      <div class="chart-stage">
        <img class="chart-skyline sky-on-light" src="/assets/img/skyline-ink.svg" alt="" aria-hidden="true">
        <img class="chart-skyline sky-on-dark" src="/assets/img/skyline.svg" alt="" aria-hidden="true">
        <canvas id="mainChart"></canvas>
        <div class="chart-zoom">
          <button id="zoomIn" aria-label="Zoom in"><i data-lucide="plus" class="i-sm"></i></button>
          <button id="zoomOut" aria-label="Zoom out"><i data-lucide="minus" class="i-sm"></i></button>
        </div>
      </div>

      <div class="chart-foot">
        <span><i class="dotlive"></i>Live</span>
        <span>Spread <b class="mono" style="color:var(--ink)">0.8</b></span>
        <span>Payout <b class="mono brandtxt" id="footPayout">88%</b></span>
        <span style="margin-left:auto" id="clock" class="mono"></span>
      </div>
    </section>

    <!-- ==================================================== ticket ----- -->
    <aside class="stack">
      <div class="ticket" data-panels>
        <div class="ticket-seg">
          <button class="active" data-panel="manual">Manual</button>
          <button data-panel="auto">Auto</button>
        </div>

        <div class="ticket-body" data-panel-id="manual">
          <div class="field" style="margin-bottom:14px">
            <label class="label" for="stake">Stake</label>
            <div class="stepper">
              <button type="button" class="step-btn" data-step="-1" aria-label="Decrease stake">
                <i data-lucide="minus" class="i-sm"></i>
              </button>
              <span class="stepper-val">
                <span class="cur">$</span>
                <input id="stake" type="number" value="25" min="1" step="1" aria-label="Stake">
              </span>
              <button type="button" class="step-btn" data-step="1" aria-label="Increase stake">
                <i data-lucide="plus" class="i-sm"></i>
              </button>
            </div>
            <div class="stake-row">
              <button class="chip" data-stake="10">10</button>
              <button class="chip active" data-stake="25">25</button>
              <button class="chip" data-stake="50">50</button>
              <button class="chip" data-stake="100">100</button>
            </div>
          </div>

          <!-- on phones this row is fixed just above the tab bar -->
          <div class="trade-btns">
            <button class="btn-up" data-dir="Rise">
              <span class="tb-main"><i data-lucide="arrow-up" class="i-sm"></i>Rise</span>
              <span class="tb-sub" id="upSub">88% · $47.00</span>
            </button>
            <button class="btn-down" data-dir="Fall">
              <span class="tb-main"><i data-lucide="arrow-down" class="i-sm"></i>Fall</span>
              <span class="tb-sub" id="downSub">88% · $47.00</span>
            </button>
          </div>
        </div>

        <div class="ticket-body" data-panel-id="auto" hidden>
          <div class="field" style="margin-bottom:12px">
            <label class="label" for="aStake">Stake per trade</label>
            <div class="stepper">
              <button type="button" class="step-btn" data-astep="-1" aria-label="Decrease"><i data-lucide="minus" class="i-sm"></i></button>
              <span class="stepper-val"><span class="cur">$</span>
                <input id="aStake" type="number" value="10" min="1" step="1" aria-label="Stake per trade"></span>
              <button type="button" class="step-btn" data-astep="1" aria-label="Increase"><i data-lucide="plus" class="i-sm"></i></button>
            </div>
          </div>

          <div class="auto-row">
            <span class="lr-tx"><b>Target profit</b><span>Stop when reached</span></span>
            <span class="auto-amt input-wrap">
              <span class="input-prefix">$</span>
              <input class="input" id="aTarget" type="number" value="50" min="1">
            </span>
          </div>

          <div class="auto-row">
            <span class="lr-tx"><b>Stop loss</b><span>Stop when reached</span></span>
            <span class="auto-amt input-wrap">
              <span class="input-prefix">$</span>
              <input class="input" id="aLoss" type="number" value="30" min="1">
            </span>
          </div>

          <div class="auto-row">
            <span class="lr-tx"><b>Martingale</b><span>Double the stake after a loss</span></span>
            <button class="switch" id="aMartingale" role="switch" aria-checked="false" aria-label="Martingale"></button>
          </div>

          <div class="payout" style="margin:14px 0">
            <div><span>Session</span><b class="mono" id="aSession">Not running</b></div>
            <div style="text-align:right"><span>Net</span><b class="mono" id="aNet">$0.00</b></div>
          </div>

          <p class="hint center" style="margin-bottom:12px">
            Runs Rise/Fall on the selected market until a limit is hit.
          </p>

          <!-- on phones this rides above the tab bar, like the Rise/Fall pair -->
          <div class="auto-btns">
            <button class="btn btn-primary btn-block btn-lg" id="aRun">
              <i data-lucide="play" class="i-sm"></i>Start auto trading
            </button>
          </div>
        </div>
      </div>

      <!-- desktop-only extra -->
      <a class="card card-flat link-row trade-extra" href="/positions">
        <span class="lr-ic"><i data-lucide="receipt-text" class="i"></i></span>
        <span class="lr-tx">
          <b>Open positions</b>
          <span><span id="openN">4</span> contracts · $100.00 at risk</span>
        </span>
        <i data-lucide="chevron-right" class="i-sm dim"></i>
      </a>
    </aside>
  </div>
</main>

<script src="/assets/js/icons.js"></script>
<script src="/assets/js/chart.js"></script>
<script src="/assets/js/data.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/qr.js"></script>
<script src="/assets/js/modals.js"></script>
<script>
(function () {
  var M = OrbisData.markets;
  var $ = function (s) { return document.querySelector(s); };

  var params = new URLSearchParams(location.search);
  var q = params.get('symbol');
  var idx = Math.max(0, M.findIndex(function (m) { return m.sym === q; }));
  var current = M[idx];

  var chart = OrbisChart.create($('#mainChart'), {
    start: current.base, vol: current.vol, seed: 11, onPrice: onPrice,
    onZoom: function (view, atMin, atMax) {
      $('#zoomIn').disabled = atMin;
      $('#zoomOut').disabled = atMax;
    }
  });

  $('#zoomIn').addEventListener('click', function () { chart.zoom(1); });
  $('#zoomOut').addEventListener('click', function () { chart.zoom(-1); });

  /* ------------------------------------------------------ chart tools -- */
  var SMA_VARS = { 20: '--viz-2', 50: '--ink-3' };
  var smaOn = [];

  function applySmas() {
    var css = getComputedStyle(document.documentElement);
    chart.setSmas(smaOn.map(function (n) {
      return { period: n, color: css.getPropertyValue(SMA_VARS[n]).trim() };
    }));
  }
  function toolIcon(id, name) {
    $(id).innerHTML = '<i data-lucide="' + name + '" class="i"></i>';
    if (window.orbisIcons) window.orbisIcons();
  }

  /* the indicators modal reads and drives the chart through these */
  window.orbisChartState = function () { return { type: chart.type, smas: smaOn }; };
  window.orbisChartType = function (t) {
    chart.setType(t);
    /* the wash under the line dims the skyline, so the panel lifts it back */
    document.querySelector('.chart-panel').classList.toggle('chart-as-line', t === 'line');
    chart.draw();
    toolIcon('#typeBtn', t === 'line' ? 'chart-line' : 'chart-candlestick');
  };
  window.orbisChartSma = function (period, on) {
    smaOn = smaOn.filter(function (n) { return n !== period; });
    if (on) smaOn.push(period);
    applySmas();
  };

  $('#typeBtn').addEventListener('click', function () {
    window.orbisChartType(chart.type === 'candle' ? 'line' : 'candle');
  });

  $('#fullBtn').addEventListener('click', function () {
    var panel = document.querySelector('.chart-panel');
    var on = panel.classList.toggle('chart-full');
    document.documentElement.style.overflow = on ? 'hidden' : '';
    toolIcon('#fullBtn', on ? 'minimize-2' : 'maximize-2');
    setTimeout(function () { chart.resize(); chart.draw(); }, 60);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    /* a modal takes the escape first, it is the thing on top */
    var scrim = document.querySelector('.modal-scrim');
    if (scrim && !scrim.hidden) return;
    if (document.querySelector('.chart-panel').classList.contains('chart-full')) {
      $('#fullBtn').click();
    }
  });

  /* ------------------------------------------------- custom dropdown -- */
  var menu = $('#pickMenu'), btn = $('#pickBtn');

  function buildMenu(filter) {
    filter = (filter || '').toLowerCase();
    var html = '<div class="mkt-menu-search">' +
      '<input class="input" id="pickSearch" type="search" placeholder="Search markets" aria-label="Search markets">' +
      '</div>';
    var shown = 0;
    Object.keys(OrbisData.cats).forEach(function (cat) {
      var rows = M.map(function (m, i) { return { m: m, i: i }; })
        .filter(function (x) {
          return x.m.cat === cat &&
            (!filter || (x.m.sym + ' ' + x.m.name).toLowerCase().indexOf(filter) > -1);
        });
      if (!rows.length) return;
      shown += rows.length;
      html += '<h5>' + OrbisData.cats[cat] + '</h5>';
      html += rows.map(function (x) {
        var up = x.m.chg >= 0;
        return '<button class="mkt-opt" role="option" data-i="' + x.i + '" aria-selected="' +
          (x.i === idx) + '">' + OrbisData.assetHTML(x.m) +
          '<span class="nm"><b>' + x.m.sym + '</b><span>' + x.m.name + '</span></span>' +
          '<span class="px"><b class="mono">' + x.m.price + '</b>' +
          '<span class="' + (up ? 'up' : 'down') + '">' + (up ? '+' : '') + x.m.chg.toFixed(2) + '%</span></span>' +
          '</button>';
      }).join('');
    });
    if (!shown) html += '<div class="empty"><b>Nothing matches</b></div>';
    menu.innerHTML = html;
    window.orbisIcons();
  }

  function openMenu(open) {
    menu.hidden = !open;
    btn.setAttribute('aria-expanded', String(open));
    if (open) {
      buildMenu('');
      var s = $('#pickSearch');
      if (s) s.focus();
    }
  }

  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    openMenu(menu.hidden);
  });

  menu.addEventListener('click', function (e) {
    e.stopPropagation();
    var opt = e.target.closest('.mkt-opt');
    if (!opt) return;
    idx = Number(opt.dataset.i);
    applyMarket(idx);
    openMenu(false);
  });

  menu.addEventListener('input', function (e) {
    if (e.target.id === 'pickSearch') {
      var v = e.target.value;
      buildMenu(v);
      var s = $('#pickSearch');
      if (s) { s.value = v; s.focus(); }
    }
  });

  document.addEventListener('click', function () { if (!menu.hidden) openMenu(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') openMenu(false); });

  /* ------------------------------------------------------------ chart -- */
  function onPrice(p) {
    $('#price').textContent = p.toLocaleString('en-US', {
      minimumFractionDigits: current.dp, maximumFractionDigits: current.dp
    });
    var pct = ((p - current.base) / current.base) * 100;
    var el = $('#chg');
    el.textContent = (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
    el.className = pct >= 0 ? 'up' : 'down';
  }

  function applyMarket(i) {
    current = M[i];
    $('#pickMark').innerHTML = OrbisData.assetHTML(current);
    $('#pickSym').textContent = current.sym;
    $('#pickCat').textContent = OrbisData.cats[current.cat] + ' · ' + current.name;
    $('#footPayout').textContent = current.payout + '%';
    chart.reseed({ start: current.base, vol: current.vol });
    calc();
    window.orbisIcons();
  }
  applyMarket(idx);

  /* ----------------------------------------------------------- ticket -- */
  function duration() {
    var b = document.querySelector('.tf button.active');
    return b ? b.textContent.trim() : '1m';
  }

  function calc() {
    var stake = Number($('#stake').value) || 0;
    var payout = stake + stake * (current.payout / 100);
    var sub = current.payout + '% · ' + OrbisData.money(payout);
    $('#upSub').textContent = sub;
    $('#downSub').textContent = sub;
  }
  $('#stake').addEventListener('input', calc);

  /* bigger jumps once the stake is past pocket change */
  document.querySelectorAll('[data-step]').forEach(function (b) {
    b.addEventListener('click', function () {
      var el = $('#stake');
      var v = Number(el.value) || 0;
      var step = v >= 20 ? 5 : 1;
      el.value = Math.max(1, v + step * Number(b.dataset.step));
      calc();
    });
  });
  document.querySelectorAll('[data-stake]').forEach(function (b) {
    b.addEventListener('click', function () { $('#stake').value = b.dataset.stake; calc(); });
  });
  calc();

  document.querySelectorAll('[data-dir]').forEach(function (b) {
    b.addEventListener('click', function () {
      /* while a contract runs this button sells it back instead */
      if (b.classList.contains('busy')) {
        if (window.orbisTradeStop) window.orbisTradeStop();
        return;
      }
      var stake = Number($('#stake').value) || 0;
      OrbisData.openTrades.unshift({
        id: 'OB-' + (948000 + Math.floor(Math.random() * 900)),
        sym: current.sym, dir: b.dataset.dir, stake: stake,
        entry: $('#price').textContent, now: $('#price').textContent,
        ends: duration(), pl: 0
      });
      var n = $('#openN');
      if (n) n.textContent = OrbisData.openTrades.length;

      window.orbisModal.trade({
        sym: current.sym, dir: b.dataset.dir, stake: stake,
        payout: current.payout, duration: duration(), entry: $('#price').textContent
      });
    });
  });

  /* ------------------------------------------- signal handed over by /ai -- */
  (function applySignal() {
    var tf = params.get('tf');
    var stake = params.get('stake');
    var dir = params.get('dir');
    if (!tf && !stake && !dir) return;

    if (tf) {
      document.querySelectorAll('.tf button').forEach(function (b) {
        if (b.textContent.trim() === tf) {
          document.querySelectorAll('.tf button').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active');
        }
      });
    }
    if (stake) {
      $('#stake').value = stake;
      document.querySelectorAll('[data-stake]').forEach(function (c) {
        c.classList.toggle('active', c.dataset.stake === stake);
      });
    }
    calc();

    if (dir) {
      var btn = document.querySelector('[data-dir="' + dir + '"]');
      if (btn) btn.classList.add('suggested');
      window.orbisToast('AI signal loaded · ' + dir + ' ' + current.sym + (tf ? ' · ' + tf : ''), 'bot');
    }
  })();

  /* --------------------------------------- a contract you can interrupt -- */
  var busyBtn;
  document.addEventListener('orbis:trade-start', function (e) {
    busyBtn = document.querySelector('[data-dir="' + e.detail.contract.dir + '"]');
    var other = document.querySelector('[data-dir="' + (e.detail.contract.dir === 'Rise' ? 'Fall' : 'Rise') + '"]');
    if (other) other.disabled = true;
    if (busyBtn) {
      busyBtn.classList.add('busy');
      busyBtn.querySelector('.tb-main').innerHTML =
        '<i data-lucide="square" class="i-sm"></i>Sell back';
      busyBtn.querySelector('.tb-sub').textContent = 'Running · ' + e.detail.total + 's';
      window.orbisIcons();
    }
  });

  document.addEventListener('orbis:trade-tick', function (e) {
    if (busyBtn) busyBtn.querySelector('.tb-sub').textContent = 'Running · ' + e.detail.left + 's';
  });

  document.addEventListener('orbis:trade-end', function () {
    document.querySelectorAll('[data-dir]').forEach(function (b) { b.disabled = false; });
    if (busyBtn) {
      var isUp = busyBtn.dataset.dir === 'Rise';
      busyBtn.classList.remove('busy');
      busyBtn.querySelector('.tb-main').innerHTML =
        '<i data-lucide="arrow-' + (isUp ? 'up' : 'down') + '" class="i-sm"></i>' + busyBtn.dataset.dir;
      window.orbisIcons();
    }
    busyBtn = null;
    calc();
  });

  /* ------------------------------------------------------ auto trading --- */
  (function auto() {
    var stake = $('#aStake'), target = $('#aTarget'), loss = $('#aLoss');
    var run = $('#aRun'), session = $('#aSession'), net = $('#aNet');
    var timer = null, pnl = 0, trades = 0;

    document.querySelectorAll('[data-astep]').forEach(function (b) {
      b.addEventListener('click', function () {
        var v = Number(stake.value) || 0;
        stake.value = Math.max(1, v + (v >= 20 ? 5 : 1) * Number(b.dataset.astep));
      });
    });

    function paint() {
      net.textContent = (pnl >= 0 ? '+' : '') + OrbisData.money(pnl);
      net.className = 'mono ' + (pnl >= 0 ? 'up' : 'down');
      session.textContent = timer ? trades + ' trade' + (trades === 1 ? '' : 's') : 'Not running';
      if (timer && window.orbisAuto) {
        window.orbisAuto.update(
          trades + ' trade' + (trades === 1 ? '' : 's') + ' · ' +
          (pnl >= 0 ? '+' : '') + OrbisData.money(pnl), pnl >= 0);
      }
    }

    function stop(why) {
      clearInterval(timer);
      timer = null;
      if (window.orbisAuto) window.orbisAuto.stop();
      run.innerHTML = '<i data-lucide="play" class="i-sm"></i>Start auto trading';
      run.classList.remove('btn-dark');
      run.classList.add('btn-primary');
      window.orbisIcons();
      paint();
      window.orbisToast('Auto trading stopped · ' + why, 'circle-stop');
    }

    run.addEventListener('click', function () {
      if (timer) return stop('by you');

      pnl = 0; trades = 0;
      var size = Number(stake.value) || 1;
      var martingale = $('#aMartingale').classList.contains('on');
      run.innerHTML = '<i data-lucide="square" class="i-sm"></i>Stop auto trading';
      run.classList.remove('btn-primary');
      run.classList.add('btn-dark');
      window.orbisIcons();
      if (window.orbisAuto) window.orbisAuto.start(function () { stop('by you'); });
      paint();

      timer = setInterval(function () {
        var won = Math.random() < 0.5;
        pnl += won ? size * (current.payout / 100) : -size;
        trades++;
        size = (martingale && !won) ? size * 2 : (Number(stake.value) || 1);
        paint();
        if (pnl >= Number(target.value)) return stop('target profit reached');
        if (pnl <= -Number(loss.value)) return stop('stop loss reached');
      }, 1400);
    });
  })();

  setInterval(function () {
    $('#clock').textContent = new Date().toUTCString().slice(17, 25) + ' UTC';
  }, 1000);
})();
</script>
</body>
</html>
