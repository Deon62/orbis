<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Transaction history · orbisflow</title>
<meta name="description" content="Deposits, withdrawals and settlements.">
<meta name="theme-color" content="#1C1C1C">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin>
<link rel="preload" as="script" href="/assets/js/app.js">
<link rel="preload" as="script" href="/assets/js/data.js">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem("orbisflow-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="cashier" data-title="Transaction history" data-tabbar="hide" data-shell="app">

<div id="site-header"></div>

<main class="wrap page-body">
  <div class="stack" style="max-width:900px">
    <div class="card card-flat" id="txList"></div>
  </div>
</main>

<script src="/assets/js/icons.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/chart.js"></script>
<script src="/assets/js/data.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/qr.js"></script>
<script src="/assets/js/modals.js"></script>
<script>
(function () {
  var A = OrbisAPI, M = A.money;

  A.load({
    el: '#txList', path: '/transactions',
    empty: { icon: 'receipt', title: 'No transactions yet',
      text: 'Deposits, withdrawals and trade settlements appear here, newest first.',
      action: '<button class="btn btn-primary btn-sm" data-modal="deposit">Make a deposit</button>' },
    render: function (d) {
      return '<div class="tbl-scroll"><table class="tbl"><thead><tr><th>Date</th><th>Type</th><th>Method</th><th>Reference</th><th>Status</th><th class="r">Amount</th></tr></thead><tbody>' +
        d.map(function (t) {
          var pos = t.amount >= 0;
          var cls = t.status === 'Completed' ? 'tag-up' : (t.status === 'Pending' ? 'tag-wait' : '');
          return '<tr><td class="dim">' + t.when + '</td><td><b>' + t.type + '</b></td><td>' + t.method + '</td>' +
            '<td class="mono dim">' + t.ref + '</td><td><span class="tag ' + cls + '">' + t.status + '</span></td>' +
            '<td class="r mono ' + (pos ? 'up' : '') + '">' + (pos ? '+' : '') + M(t.amount) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }
  });
})();
</script>
</body>
</html>
