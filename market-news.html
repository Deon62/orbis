<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Market news · orbisflow</title>
<meta name="description" content="Headlines moving the instruments you trade.">
<meta name="theme-color" content="#1C1C1C">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin>
<link rel="preload" as="script" href="/assets/js/app.js">
<link rel="preload" as="script" href="/assets/js/data.js">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem("orbisflow-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="market-news" data-title="Market news" data-tabbar="hide" data-shell="app">

<div id="site-header"></div>

<main class="wrap page-body">
  <div class="card card-flat" id="newsList"></div>
</main>

<script src="/assets/js/icons.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/chart.js"></script>
<script src="/assets/js/data.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/qr.js"></script>
<script src="/assets/js/modals.js"></script>

<script>
(function () {
  var A = OrbisAPI, M = A.money;

  A.load({
    el: '#newsList', path: '/news',
    empty: { icon: 'newspaper', title: 'No news right now',
      text: 'Headlines that move the markets you trade appear here as they break.' },
    render: function (d) {
      return d.map(function (n) {
        return '<a class="news-row" href="' + (n.url || '#') + '" target="_blank" rel="noopener"><span class="news-tx"><b>' + n.title + '</b>' +
          '<span>' + n.source + ' · ' + n.ago + '</span></span>' + (n.sym ? '<span class="tag">' + n.sym + '</span>' : '') + '</a>';
      }).join('');
    }
  });
})();
</script>
</body>
</html>
