<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Create account · orbisflow</title>
<meta name="description" content="Open a free account with $10,000 in demo funds.">
<meta name="theme-color" content="#1C1C1C">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem("orbisflow-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="signup" data-shell="bare">

<main class="auth">
  <aside class="auth-aside">
    <img class="auth-skyline" src="/assets/img/skyline.svg" alt="" aria-hidden="true">
    <a class="logo" href="/" style="position:relative;z-index:2">
      <span class="logo-word on-dark">orbis<span class="flow">flow</span></span>
    </a>
    <p class="auth-quote">$10,000 demo funds. No deposit.</p>
    <div class="auth-stats">
      <div><b class="num">2 min</b><span>To first trade</span></div>
      <div><b class="num">$1</b><span>Min stake</span></div>
      <div><b class="num">35%</b><span>Referral share</span></div>
    </div>
  </aside>

  <div class="auth-main">
    <div class="auth-top">
      <a class="logo logo-lg" href="/">
        <span class="logo-word">orbis<span class="flow">flow</span></span>
      </a>
    </div>

    <div class="auth-card">
      <h1>Create account</h1>

      <form data-mock-submit="Demo account created" data-go="/trade">
        <div class="row2">
          <div class="field">
            <label class="label" for="fn">First name</label>
            <input class="input" id="fn" type="text" placeholder="Amara" required>
          </div>
          <div class="field">
            <label class="label" for="ln">Last name</label>
            <input class="input" id="ln" type="text" placeholder="Otieno" required>
          </div>
        </div>

        <div class="field">
          <label class="label" for="email">Email</label>
          <input class="input" id="email" type="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label class="label" for="country">Country</label>
          <select class="select" id="country">
            <option>Kenya</option><option>Nigeria</option><option>South Africa</option>
            <option>Ghana</option><option>Tanzania</option><option>United Kingdom</option><option>Other</option>
          </select>
        </div>

        <div class="field">
          <label class="label" for="pw">Password</label>
          <div class="input-wrap">
            <input class="input" id="pw" type="password" placeholder="8+ characters" required>
            <button type="button" class="input-affix" data-reveal="#pw" aria-label="Show password">
              <i data-lucide="eye" class="i-sm"></i>
            </button>
          </div>
        </div>

        <div class="field">
          <label class="label" for="ref">Referral code <span class="dim" style="font-weight:400">— optional</span></label>
          <input class="input" id="ref" type="text" placeholder="ORBIS-4K92">
        </div>

        <label class="check" style="margin:2px 0 18px">
          <input type="checkbox" required>
          <span>I'm 18+ and accept the <a href="#" data-mock="Terms">Terms</a> and
            <a href="#" data-mock="Privacy">Privacy policy</a>.</span>
        </label>

        <button class="btn btn-primary btn-block btn-lg" type="submit">Create account</button>
      </form>

      <div class="or">or</div>

      <button class="btn btn-google btn-block" data-login="/trade">
        <img src="/assets/img/google.svg" alt=""> Continue with Google
      </button>

      <p class="auth-foot">Have an account? <a href="/login">Log in</a></p>
    </div>

    <p class="auth-legal">Prototype — no account is created.</p>
  </div>
</main>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="/assets/js/app.js"></script>
</body>
</html>
