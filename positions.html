<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Positions · orbisflow</title>
<meta name="description" content="Open contracts, settled contracts and trading statistics.">
<meta name="theme-color" content="#1C1C1C">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin>
<link rel="preload" as="script" href="/assets/js/app.js">
<link rel="preload" as="script" href="/assets/js/data.js">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem("orbisflow-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="positions" data-shell="app">

<div id="site-header"></div>

<main class="wrap page-body">

  <section class="card card-flat" data-panels>
    <div class="card-hd">
      <div class="fdrop" data-fdrop>
      <button class="fdrop-btn" aria-haspopup="listbox" aria-expanded="false"><span class="fdrop-val">Open</span><i data-lucide="chevron-down" class="i-sm chev"></i></button>
      <div class="fdrop-menu" hidden role="listbox">
        <button class="fdrop-opt" role="option" data-v="open" data-panel="open" aria-selected="true"><span class="fdrop-tx">Open</span></button>
        <button class="fdrop-opt" role="option" data-v="closed" data-panel="closed" aria-selected="false"><span class="fdrop-tx">Settled</span></button>
        <button class="fdrop-opt" role="option" data-v="stats" data-panel="stats" aria-selected="false"><span class="fdrop-tx">Statistics</span></button>
      </div>
    </div>
      <button class="btn btn-ghost btn-sm" id="exportBtn" data-mock="Statement export" disabled><i data-lucide="download" class="i-sm"></i>Export</button>
    </div>

    <div data-panel-id="open" id="openPane"></div>
    <div data-panel-id="closed" id="closedPane" hidden></div>
    <div data-panel-id="stats" id="statsPane" hidden class="card-pad"></div>
  </section>
</main>

<div id="site-footer"></div>

<script src="/assets/js/icons.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/chart.js"></script>
<script src="/assets/js/data.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/qr.js"></script>
<script src="/assets/js/modals.js"></script>
<script>
(function () {
  var A = OrbisAPI, M = A.money;

  function pl(n) { return '<span class="mono ' + (n >= 0 ? 'up' : 'down') + '">' + (n >= 0 ? '+' : '') + M(n) + '</span>'; }

  A.load({
    el: '#openPane', path: '/trades/open',
    empty: { icon: 'chart-candlestick', title: 'No open positions',
      text: 'Contracts you place show here while they run, with live profit and the time left.',
      action: '<a class="btn btn-primary btn-sm" href="/trade">Place a trade</a>' },
    render: function (d) {
      return '<div class="tbl-scroll"><table class="tbl"><thead><tr><th>Contract</th><th>Market</th><th>Direction</th>' +
        '<th class="r">Stake</th><th class="r">Entry</th><th class="r">Current</th><th class="r">Ends in</th><th class="r">P/L</th><th></th></tr></thead><tbody>' +
        d.map(function (t) {
          return '<tr><td class="mono dim">' + t.id + '</td><td><b>' + t.sym + '</b></td>' +
            '<td><span class="tag ' + (t.dir === 'Rise' ? 'tag-up' : 'tag-down') + '">' + t.dir + '</span></td>' +
            '<td class="r mono">' + M(t.stake) + '</td><td class="r mono">' + t.entry + '</td><td class="r mono">' + t.now + '</td>' +
            '<td class="r mono">' + t.ends + '</td><td class="r">' + pl(t.pl) + '</td>' +
            '<td class="r"><button class="btn btn-ghost btn-sm" data-mock="Sell back contract">Sell back</button></td></tr>';
        }).join('') + '</tbody></table></div>';
    }
  });

  A.load({
    el: '#closedPane', path: '/trades/closed',
    empty: { icon: 'receipt-text', title: 'No settled contracts yet',
      text: 'Every contract lands here once it expires, with its entry, exit and result.' },
    render: function (d) {
      return '<div class="tbl-scroll"><table class="tbl"><thead><tr><th>Contract</th><th>Market</th><th>Direction</th>' +
        '<th class="r">Stake</th><th class="r">Entry</th><th class="r">Exit</th><th>Result</th><th class="r">P/L</th><th class="r">Settled</th></tr></thead><tbody>' +
        d.map(function (t) {
          var won = t.result === 'won';
          return '<tr><td class="mono dim">' + t.id + '</td><td><b>' + t.sym + '</b></td><td>' + t.dir + '</td>' +
            '<td class="r mono">' + M(t.stake) + '</td><td class="r mono">' + t.entry + '</td><td class="r mono">' + t.exit + '</td>' +
            '<td><span class="tag ' + (won ? 'tag-up' : 'tag-down') + '">' + (won ? 'Won' : 'Lost') + '</span></td>' +
            '<td class="r">' + pl(t.pl) + '</td><td class="r dim">' + t.when + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    },
    after: function () { document.getElementById('exportBtn').disabled = false; }
  });

  A.load({
    el: '#statsPane', path: '/trades/stats',
    empty: { icon: 'activity', title: 'No statistics yet',
      text: 'Once contracts settle, see how you do by market and by duration.' },
    render: function (d) {
      return '<div class="split" style="gap:34px"><div><h3 style="font-size:15px;margin-bottom:12px">By market</h3>' +
        (d.byMarket || []).map(function (r) { return '<div class="kv"><span>' + r[0] + '</span><b>' + pl(r[1]) + '</b></div>'; }).join('') +
        '</div><div><h3 style="font-size:15px;margin-bottom:12px">By duration</h3>' +
        (d.byDuration || []).map(function (r) { return '<div class="kv"><span>' + r[0] + '</span><b class="mono">' + r[1] + ' contracts · ' + r[2] + '% won</b></div>'; }).join('') +
        '</div></div>';
    }
  });
})();
</script>
</body>
</html>
