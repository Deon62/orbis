<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Profit table · orbisflow</title>
<meta name="description" content="Daily trading result.">
<meta name="theme-color" content="#1C1C1C">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin>
<link rel="preload" as="script" href="/assets/js/app.js">
<link rel="preload" as="script" href="/assets/js/data.js">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem("orbisflow-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="profit-table" data-title="Profit table" data-tabbar="hide" data-shell="app">

<div id="site-header"></div>

<main class="wrap page-body">
  <div class="card card-flat" id="plList"></div>
</main>

<script src="/assets/js/icons.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/chart.js"></script>
<script src="/assets/js/data.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/qr.js"></script>
<script src="/assets/js/modals.js"></script>

<script>
(function () {
  var A = OrbisAPI, M = A.money;

  A.load({
    el: '#plList', path: '/reports/profit',
    empty: { icon: 'table', title: 'Nothing to report yet',
      text: 'A row for every day you trade: contracts won and lost, turnover and net profit.',
      action: '<a class="btn btn-primary btn-sm" href="/trade">Start trading</a>' },
    render: function (d) {
      return '<div class="tbl-scroll"><table class="tbl"><thead><tr><th>Date</th><th class="r">Trades</th><th class="r">Won</th><th class="r">Lost</th><th class="r">Turnover</th><th class="r">Net P/L</th></tr></thead><tbody>' +
        d.map(function (r) {
          return '<tr><td>' + r.date + '</td><td class="r">' + r.trades + '</td><td class="r">' + r.won + '</td><td class="r">' + r.lost + '</td>' +
            '<td class="r">' + M(r.turnover) + '</td><td class="r"><span class="mono ' + (r.pl >= 0 ? 'up' : 'down') + '">' + (r.pl >= 0 ? '+' : '') + M(r.pl) + '</span></td></tr>';
        }).join('') + '</tbody></table></div>';
    }
  });
})();
</script>
</body>
</html>
