<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Payment methods · orbisflow</title>
<meta name="description" content="Saved deposit and withdrawal methods.">
<meta name="theme-color" content="#1C1C1C">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin>
<link rel="preload" as="script" href="/assets/js/app.js">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem("orbisflow-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="payments" data-nav="account" data-title="Payment methods" data-tabbar="hide" data-shell="app">

<div id="site-header"></div>

<main class="wrap page-body">
  <div class="stack" style="max-width:720px">
    <div class="card card-flat" id="pmList"></div>
  </div>
</main>

<script src="/assets/js/icons.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/qr.js"></script>
<script src="/assets/js/modals.js"></script>
<script>
(function () {
  var A = OrbisAPI, M = A.money;

  var ICON = { mpesa: 'smartphone', card: 'credit-card', bank: 'building-2', usdt: 'bitcoin' };
  var ADD = '<button class="btn btn-primary btn-sm" data-modal="add-payment"><i data-lucide="plus" class="i-sm"></i>Add a method</button>';
  A.load({
    el: '#pmList', path: '/payment-methods',
    empty: { icon: 'wallet', title: 'No payment methods yet',
      text: 'Add M-Pesa, a bank account or a USDT wallet in your own name. Withdrawals are only paid to verified methods.', action: ADD },
    render: function (d) {
      return d.map(function (m) {
        return '<div class="row-line"><div style="display:flex;align-items:center;gap:12px">' +
          '<span class="method-ic"><i data-lucide="' + (ICON[m.kind] || 'wallet') + '" class="i"></i></span>' +
          '<div><b>' + m.label + '</b><span>' + m.masked + (m.isDefault ? ' · default' : '') + '</span></div></div>' +
          (m.status === 'Verified' ? '<span class="tag tag-up">Verified</span>' : '<span class="tag tag-wait">' + m.status + '</span>') + '</div>';
      }).join('') + '<div class="center-action">' + ADD + '</div>';
    }
  });
})();
</script>
</body>
</html>
