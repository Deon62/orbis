<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Personal details · orbisflow</title>
<meta name="description" content="Name, email, phone and account currency.">
<meta name="theme-color" content="#1C1C1C">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem("orbisflow-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="profile-details" data-nav="account" data-title="Personal details" data-shell="app">

<div id="site-header"></div>

<main class="wrap page-body">
  <div class="stack" style="max-width:720px">
    <div class="card card-pad">
      <form data-mock-submit="Saved">
        <div class="row2">
          <div class="field">
            <label class="label" for="afn">First name</label>
            <input class="input" id="afn" value="Amara">
          </div>
          <div class="field">
            <label class="label" for="aln">Last name</label>
            <input class="input" id="aln" value="Otieno">
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label class="label" for="aem">Email</label>
            <input class="input" id="aem" type="email" value="ceo@ardena.co.ke">
          </div>
          <div class="field">
            <label class="label" for="aph">Phone</label>
            <input class="input" id="aph" type="tel" value="+254 712 000 412">
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label class="label" for="acy">Country</label>
            <select class="select" id="acy"><option>Kenya</option><option>Nigeria</option><option>Ghana</option></select>
          </div>
          <div class="field">
            <label class="label" for="acur">Account currency</label>
            <select class="select" id="acur"><option>USD</option><option>KES</option><option>USDT</option></select>
          </div>
        </div>
        <button class="btn btn-primary" type="submit">Save changes</button>
      </form>
    </div>
  </div>
</main>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/modals.js"></script>
</body>
</html>
