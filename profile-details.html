<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Personal details · orbisflow</title>
<meta name="description" content="Name, email, phone and account currency.">
<meta name="theme-color" content="#1C1C1C">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin>
<link rel="preload" as="script" href="/assets/js/app.js">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem("orbisflow-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="profile-details" data-nav="account" data-title="Personal details" data-shell="app">

<div id="site-header"></div>

<main class="wrap page-body">
  <div class="stack" style="max-width:720px">
    <div class="card card-flat card-pad" style="padding-inline:0">
      <form data-mock-submit="Saved">
        <div class="field">
          <label class="label" for="atn">Trader name</label>
          <input class="input" id="atn" placeholder="Your full name" autocomplete="name">
        </div>

        <div class="field">
          <label class="label" for="aem">Email</label>
          <input class="input" id="aem" type="email" placeholder="you@example.com" autocomplete="email">
        </div>

        <div class="field">
          <label class="label" for="aph">Phone</label>
          <input class="input" id="aph" type="tel" placeholder="+254 7XX XXX XXX" autocomplete="tel">
        </div>

        <!-- kept side by side at every width, so the form fits without scrolling -->
        <div class="row2-tight">
          <div class="field">
            <label class="label">Country</label>
            <button type="button" class="select ctry-trigger" data-modal="country" data-code="">
              <img class="ctry-flag" src="https://flagcdn.com/w40/un.png" alt="">
              <span class="ctry-name">Select country</span>
              <i data-lucide="chevron-down" class="i-sm"></i>
            </button>
          </div>
          <div class="field">
            <label class="label" for="acur">Currency</label>
            <select class="select" id="acur"><option>USD</option><option>KES</option><option>USDT</option></select>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Save changes</button>
        </div>
      </form>
    </div>
  </main>

<script src="/assets/js/icons.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/countries.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/qr.js"></script>
<script src="/assets/js/modals.js"></script>
<script>
(function () {
  var A = OrbisAPI, M = A.money;

  A.get('/me').then(function (me) {
    if (!me) return;
    if (me.name) document.getElementById('atn').value = me.name;
    if (me.email) document.getElementById('aem').value = me.email;
    if (me.phone) document.getElementById('aph').value = me.phone;
    if (me.currency) document.getElementById('acur').value = me.currency;
    if (me.country) {
      var t = document.querySelector('.ctry-trigger');
      t.dataset.code = me.country.code;
      t.querySelector('.ctry-flag').src = 'https://flagcdn.com/w40/' + me.country.code + '.png';
      t.querySelector('.ctry-name').textContent = me.country.name;
    }
  }).catch(function () {});
})();
</script>
</body>
</html>
