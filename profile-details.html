<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Personal details · obisflow</title>
<meta name="description" content="Name, email, phone and account currency.">
<meta name="theme-color" content="#1C1C1C">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin>
<link rel="preload" as="script" href="/assets/js/app.js">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem("orbisflow-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="profile-details" data-nav="account" data-title="Personal details" data-shell="app">

<div id="site-header"></div>

<main class="wrap page-body">
  <div class="stack" style="max-width:720px">
    <!-- read-only first: email and phone are masked so a screenshot does not give them away -->
    <section id="pdView" class="pd-view">
      <div class="pd-row"><span>Name</span><b data-pd="name">-</b></div>
      <div class="pd-row"><span>Email</span><b data-pd="email">-</b></div>
      <div class="pd-row"><span>Phone</span><b data-pd="phone">-</b></div>
      <div class="pd-row"><span>Country</span><b data-pd="country">-</b></div>
      <div class="pd-row"><span>Currency</span><b data-pd="currency">-</b></div>
      <div class="pd-acts">
        <button type="button" class="btn btn-ghost btn-sm" id="pdEdit"><i data-lucide="sliders-horizontal" class="i-sm"></i>Edit details</button>
      </div>
    </section>

    <div class="card card-flat card-pad" style="padding-inline:0" id="pdForm" hidden>
      <form data-mock-submit="Saved" id="profileForm">
        <div class="field">
          <label class="label" for="atn">Name</label>
          <input class="input" id="atn" placeholder="Your full name" autocomplete="name">
        </div>

        <div class="field">
          <label class="label" for="aem">Email</label>
          <input class="input" id="aem" type="text" placeholder="you@example.com" autocomplete="email">
        </div>

        <div class="field">
          <label class="label" for="aph">Phone</label>
          <input class="input" id="aph" type="tel" placeholder="+254 7XX XXX XXX" autocomplete="tel">
        </div>

        <!-- kept side by side at every width, so the form fits without scrolling -->
        <div class="row2-tight">
          <div class="field">
            <label class="label">Country</label>
            <button type="button" class="select ctry-trigger" data-modal="country" data-code="">
              <img class="ctry-flag" src="https://flagcdn.com/w40/un.png" alt="">
              <span class="ctry-name">Select country</span>
              <i data-lucide="chevron-down" class="i-sm"></i>
            </button>
          </div>
          <div class="field">
            <label class="label" for="acur">Currency</label>
            <select class="select" id="acur"><option>USD</option><option>KES</option><option>USDT</option></select>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn btn-quiet" type="button" id="pdCancel">Cancel</button>
          <button class="btn btn-primary" type="submit">Save changes</button>
        </div>
      </form>
    </div>
  </main>

<script src="/assets/js/icons.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/countries.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/qr.js"></script>
<script src="/assets/js/modals.js"></script>
<script>
(function () {
  var A = OrbisAPI, M = A.money;

  /* d•••n@gmail.com and +254 7•• ••• 278: enough to recognise, not enough to copy */
  function maskEmail(e) {
    var at = (e || '').indexOf('@');
    if (at < 1) return e || '-';
    var u = e.slice(0, at);
    return (u.length <= 2 ? u[0] + '•' : u[0] + '•••' + u[u.length - 1]) + e.slice(at);
  }
  function maskPhone(p) {
    var d = (p || '').replace(/\D/g, '');
    if (d.length < 7) return p || '-';
    var rest = d.indexOf('254') === 0 ? d.slice(3) : d[0] === '0' ? d.slice(1) : null;
    if (rest) return '+254 ' + rest[0] + '•• ••• ' + rest.slice(-3);
    return '+' + d.slice(0, 2) + ' ••• ••• ' + d.slice(-3);
  }
  function fill(me) {
    var v = function (k, t) { document.querySelector('[data-pd="' + k + '"]').textContent = t || '-'; };
    v('name', me.name);
    v('email', maskEmail(me.email));
    v('phone', me.phone ? maskPhone(me.phone) : '');
    v('country', me.country && me.country.name);
    v('currency', me.currency);
  }
  var view = document.getElementById('pdView'), formBox = document.getElementById('pdForm');
  function editing(on) {
    view.hidden = on; formBox.hidden = !on;
    if (on) document.getElementById('atn').focus();
  }
  document.getElementById('pdEdit').addEventListener('click', function () { editing(true); });
  document.getElementById('pdCancel').addEventListener('click', function () { editing(false); });

  A.get('/me').then(function (me) {
    if (!me) return;
    fill(me);
    if (me.name) document.getElementById('atn').value = me.name;
    if (me.email) document.getElementById('aem').value = maskEmail(me.email);   /* the sign-in email, not edited here */
    if (me.phone) document.getElementById('aph').value = me.phone;
    if (me.currency) document.getElementById('acur').value = me.currency;
    if (me.country) {
      var t = document.querySelector('.ctry-trigger');
      t.dataset.code = me.country.code;
      t.querySelector('.ctry-flag').src = 'https://flagcdn.com/w40/' + me.country.code + '.png';
      t.querySelector('.ctry-name').textContent = me.country.name;
    }
  }).catch(function () {});

  /* saving goes to the API once it is connected; the email is the sign-in
     address, so it is shown but not edited here */
  if (!A.connected) return;
  var form = document.getElementById('profileForm');
  var email = document.getElementById('aem');
  form.removeAttribute('data-mock-submit');
  email.readOnly = true;
  email.title = 'Your sign-in email';
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = form.querySelector('[type=submit]');
    var t = document.querySelector('.ctry-trigger');
    var body = {
      name: document.getElementById('atn').value.trim() || null,
      phone: document.getElementById('aph').value.trim(),
      currency: document.getElementById('acur').value
    };
    if (t.dataset.code) { body.country_code = t.dataset.code; body.country_name = t.querySelector('.ctry-name').textContent; }
    var done = window.orbisBusy ? window.orbisBusy(btn, 'Saving your profile') : function () {};
    A.patch('/me', body).then(function (p) {
      A.setProfile(p);
      fill(p);
      editing(false);
      if (window.orbisRefreshAccount) window.orbisRefreshAccount();
      window.orbisToast('Profile saved', 'check-circle-2');
    }).catch(function (err) {
      window.orbisToast(err.message, 'triangle-alert');
    }).then(done);
  });
})();
</script>
</body>
</html>
