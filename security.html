<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Security · orbisflow</title>
<meta name="description" content="Password, two-factor authentication and sessions.">
<meta name="theme-color" content="#1C1C1C">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin>
<link rel="preload" as="script" href="/assets/js/app.js">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem("orbisflow-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="security" data-nav="account" data-title="Security" data-tabbar="hide" data-shell="app">

<div id="site-header"></div>

<main class="wrap page-body">
  <div class="stack" style="max-width:720px">
    <div class="card card-flat">
      <div class="row-line">
        <div><b>Password</b><span id="sPwTx">Change it any time, and on every device you sign out of</span></div>
        <button class="btn btn-ghost btn-sm" data-mock="Change password" id="sPw">Change</button>
      </div>
      <div class="row-line">
        <div><b>Two-factor authentication</b><span id="s2faTx">A code by email or text message at every sign-in</span></div>
        <button class="btn btn-primary btn-sm" data-mock="Enable 2FA" id="s2fa">Enable</button>
      </div>
      <div class="row-line">
        <div><b>Login alerts</b><span>Email me on a new device</span></div>
        <button class="switch on" role="switch" aria-checked="true" aria-label="Login alerts" id="sAlerts"></button>
      </div>
      <div class="row-line">
        <div><b>Withdrawal confirmation</b><span>A code to approve every withdrawal</span></div>
        <button class="switch on" role="switch" aria-checked="true" aria-label="Withdrawal confirmation" id="sWd"></button>
      </div>
    </div>

    <div class="card card-flat">
      <div class="card-hd"><h3>Active sessions</h3><button class="btn btn-ghost btn-sm" data-mock="Sign out all devices" id="sAll">Sign out all</button></div>
      <div id="sessList"></div>
    </div>
  </div>
</main>

<script src="/assets/js/icons.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/qr.js"></script>
<script src="/assets/js/modals.js"></script>
<script>
(function () {
  var A = OrbisAPI, M = A.money;
  if (A.connected) return;   /* the live script below has it */

  /* this device is known from the browser itself; the others come from the API */
  var ua = navigator.userAgent;
  var browser = /Edg\//.test(ua) ? 'Edge' : /OPR\//.test(ua) ? 'Opera' : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : /Firefox\//.test(ua) ? 'Firefox' : 'Browser';
  var os = /Windows/.test(ua) ? 'Windows' : /Android/.test(ua) ? 'Android' : /iPhone|iPad/.test(ua) ? 'iOS' : /Mac OS X/.test(ua) ? 'macOS' : /Linux/.test(ua) ? 'Linux' : '';
  var here = '<div class="row-line"><div><b>' + browser + (os ? ' · ' + os : '') + '</b><span>Signed in now</span></div><span class="tag tag-up">This device</span></div>';
  var list = document.getElementById('sessList');
  list.innerHTML = here;
  A.get('/sessions').then(function (d) {
    (d || []).filter(function (x) { return !x.current; }).forEach(function (x) {
      list.insertAdjacentHTML('beforeend', '<div class="row-line"><div><b>' + x.device + '</b><span>' + x.place + ' · ' + x.lastSeen + '</span></div>' +
        '<button class="btn btn-quiet btn-sm" data-mock="Revoke session">Revoke</button></div>');
    });
  }).catch(function () {});
})();
</script>
<script>
/* Security, against the API: password, two-factor by email or SMS, alerts,
   withdrawal codes and signed-in devices. */
(function () {
  var A = window.OrbisAPI;
  if (!A || !A.connected) return;
  var Mo = window.orbisModal, toast = window.orbisToast;
  var $ = function (id) { return document.getElementById(id); };
  var P = null;
  ['sPw', 's2fa', 'sAll'].forEach(function (id) { $(id).removeAttribute('data-mock'); });

  function day(iso) { return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); }
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function setSwitch(el, on) { el.classList.toggle('on', !!on); el.setAttribute('aria-checked', String(!!on)); }

  function paint(p) {
    P = p;
    $('sPwTx').textContent = p.passwordChangedAt ? 'Last changed ' + day(p.passwordChangedAt)
      : 'Change it any time. Other devices are signed out when you do';
    var on = p.twofa.enabled;
    $('s2faTx').textContent = on ? 'On · a code by ' + (p.twofa.channel === 'sms' ? 'text message' : 'email') + ' at every sign-in'
      : 'Off · add a code by email or text message at every sign-in';
    $('s2fa').textContent = on ? 'Turn off' : 'Enable';
    $('s2fa').className = 'btn btn-sm ' + (on ? 'btn-ghost' : 'btn-primary');
    setSwitch($('sAlerts'), p.loginAlerts);
    setSwitch($('sWd'), p.withdrawalConfirm);
  }
  A.get('/preferences').then(function (p) { if (p) paint(p); }).catch(function () {});

  /* ------------------------------------------------ a code, asked for ---- */
  function codeStep(title, where, verify, resend, done) {
    Mo.open(title,
      '<div class="modal-bd">' +
        '<p class="hint" style="margin-top:0" id="cWhere">We sent a 6-digit code to <b>' + esc(where) + '</b>. It expires in 10 minutes.</p>' +
        '<input class="input otp-input" id="cCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">' +
        '<button class="linkish" id="cAgain" style="margin-top:10px">Send a new code</button>' +
      '</div>' +
      '<div class="modal-ft"><button class="btn btn-primary btn-block" id="cGo">Confirm</button></div>',
      function (root) {
        var input = root.querySelector('#cCode'), go = root.querySelector('#cGo');
        input.focus();
        input.addEventListener('input', function () { input.value = input.value.replace(/\D/g, '').slice(0, 6); });
        go.addEventListener('click', function () {
          go.disabled = true;
          verify(input.value).then(function (r) { Mo.close(); done(r); })
            .catch(function (err) { go.disabled = false; input.value = ''; input.focus(); toast(err.message, 'triangle-alert'); });
        });
        root.querySelector('#cAgain').addEventListener('click', function () {
          resend().then(function (r) {
            root.querySelector('#cWhere').innerHTML = 'We sent a new code to <b>' + esc(r.to) + '</b>.';
          }).catch(function (err) { toast(err.message, 'triangle-alert'); });
        });
      });
  }

  /* ---------------------------------------------------------- password ---- */
  $('sPw').addEventListener('click', function () {
    Mo.open('Change password',
      '<div class="modal-bd">' +
        '<div class="field"><label class="label" for="pwOld">Current password</label>' +
          '<input class="input" id="pwOld" type="password" autocomplete="current-password"></div>' +
        '<div class="field"><label class="label" for="pwNew">New password</label>' +
          '<input class="input" id="pwNew" type="password" autocomplete="new-password" placeholder="8+ characters"></div>' +
        '<div class="field"><label class="label" for="pwNew2">New password again</label>' +
          '<input class="input" id="pwNew2" type="password" autocomplete="new-password"></div>' +
        '<p class="hint">Every other device is signed out when you change it.</p>' +
      '</div>' +
      '<div class="modal-ft"><button class="btn btn-primary btn-block" id="pwGo">Change password</button></div>',
      function (root) {
        var go = root.querySelector('#pwGo');
        go.addEventListener('click', function () {
          var a = root.querySelector('#pwNew').value, b = root.querySelector('#pwNew2').value;
          if (a.length < 8) return toast('Use at least 8 characters.', 'triangle-alert');
          if (a !== b) return toast('The two new passwords do not match.', 'triangle-alert');
          go.disabled = true;
          A.post('/security/password', { current_password: root.querySelector('#pwOld').value, new_password: a })
            .then(function () {
              Mo.close(); toast('Password changed. Other devices were signed out.', 'check-circle-2');
              A.get('/preferences').then(paint); loadSessions();
            }).catch(function (err) { go.disabled = false; toast(err.message, 'triangle-alert'); });
        });
      });
  });

  /* -------------------------------------------------------- two-factor ---- */
  $('s2fa').addEventListener('click', function () {
    if (P && P.twofa.enabled) {
      return A.post('/security/2fa/disable/start').then(function (r) {
        codeStep('Turn off two-factor', r.to,
          function (code) { return A.post('/security/2fa/disable', { code: code }); },
          function () { return A.post('/security/2fa/disable/start'); },
          function (p) { paint(p); toast('Two-factor sign-in is off', 'check'); });
      }).catch(function (err) { toast(err.message, 'triangle-alert'); });
    }
    var prof = (A.session() || {}).profile || {};
    Mo.open('Two-factor sign-in',
      '<div class="modal-bd">' +
        '<p class="hint" style="margin-top:0">Every sign-in will also ask for a 6-digit code. Where should we send it?</p>' +
        '<div class="stack-sm">' +
          '<button class="method active" data-ch="email"><span style="flex:1;text-align:left"><b>Email</b><span>' +
            esc(prof.email || 'Your account email') + '</span></span><i class="pick-dot"></i></button>' +
          '<button class="method" data-ch="sms"' + (prof.phone ? '' : ' disabled') + '><span style="flex:1;text-align:left"><b>Text message</b><span>' +
            (prof.phone ? esc(prof.phone) : 'Add a phone number in Profile first') + '</span></span><i class="pick-dot"></i></button>' +
        '</div>' +
      '</div>' +
      '<div class="modal-ft"><button class="btn btn-primary btn-block" id="tfGo">Send a code</button></div>',
      function (root) {
        var ch = 'email', go = root.querySelector('#tfGo');
        root.querySelectorAll('[data-ch]').forEach(function (b) {
          b.addEventListener('click', function () { if (!b.disabled) ch = b.dataset.ch; });
        });
        go.addEventListener('click', function () {
          go.disabled = true;
          A.post('/security/2fa/start', { channel: ch }).then(function (r) {
            codeStep('Turn on two-factor', r.to,
              function (code) { return A.post('/security/2fa/enable', { code: code }); },
              function () { return A.post('/security/2fa/start', { channel: ch }); },
              function (p) { paint(p); toast('Two-factor sign-in is on', 'check-circle-2'); });
          }).catch(function (err) { go.disabled = false; toast(err.message, 'triangle-alert'); });
        });
      });
  });

  /* ------------------------------------------------------------ switches ---- */
  /* these run before the shell flips the switch, so the new state is the opposite */
  $('sAlerts').addEventListener('click', function () {
    var on = !this.classList.contains('on');
    A.patch('/preferences', { login_alerts: on }).then(paint).then(function () { toast('Saved', 'check'); })
      .catch(function (err) { toast(err.message, 'triangle-alert'); if (P) paint(P); });
  });
  $('sWd').addEventListener('click', function () {
    var on = !this.classList.contains('on');
    A.put('/security/withdrawal-confirm', { enabled: on }).then(paint).then(function () { toast('Saved', 'check'); })
      .catch(function (err) { toast(err.message, 'triangle-alert'); if (P) paint(P); });
  });

  /* ------------------------------------------------------------ devices ---- */
  var list = $('sessList');
  function loadSessions() {
    A.load({
      el: list, path: '/sessions',
      empty: { icon: 'shield', title: 'No devices yet', text: 'Devices that sign in to your account show here.' },
      render: function (d) {
        return d.map(function (x) {
          return '<div class="row-line"><div><b>' + esc(x.device) + '</b><span>' + esc(x.place) + ' · ' + esc(x.lastSeen) + '</span></div>' +
            (x.current ? '<span class="tag tag-up">This device</span>'
              : '<button class="btn btn-quiet btn-sm" data-revoke="' + esc(x.id) + '">Revoke</button>') + '</div>';
        }).join('');
      }
    });
  }
  list.addEventListener('click', function (e) {
    var b = e.target.closest('[data-revoke]');
    if (!b) return;
    b.disabled = true;
    A.del('/sessions/' + encodeURIComponent(b.dataset.revoke)).then(function () {
      toast('That device was signed out', 'check'); loadSessions();
    }).catch(function (err) { b.disabled = false; toast(err.message, 'triangle-alert'); });
  });
  $('sAll').addEventListener('click', function () {
    this.disabled = true;
    var btn = this;
    A.post('/sessions/revoke-others').then(function () {
      toast('Every other device was signed out', 'check-circle-2'); loadSessions();
    }).catch(function (err) { toast(err.message, 'triangle-alert'); }).then(function () { btn.disabled = false; });
  });
  loadSessions();
})();
</script>
</body>
</html>
