<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>System status · orbisflow</title>
<meta name="description" content="Live status and 90-day uptime for trading, prices, payments and support at orbisflow.">
<meta name="theme-color" content="#1C1C1C">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin>
<link rel="preload" as="script" href="/assets/js/icons.js">
<link rel="preload" as="script" href="/assets/js/app.js">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem("orbisflow-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="status" data-shell="public">

<div id="site-header"></div>

<section class="page-hero st-hero">
  <div class="wrap st-wrap">
    <p class="sec-eyebrow">System status</p>
    <h1>Is orbisflow working?</h1>
    <div class="st-banner" id="stBanner">
      <span class="st-banner-ic"><i data-lucide="check" class="i"></i></span>
      <div><b>All systems operational</b><span id="stUpdated">Checked just now</span></div>
    </div>
  </div>
</section>

<section class="sec st-sec">
  <div class="wrap st-wrap">
    <div class="st-bar-hd">
      <h2>Uptime</h2>
      <div class="seg st-range" role="group" aria-label="Time range">
        <button type="button" data-days="30">30 days</button>
        <button type="button" data-days="60">60 days</button>
        <button type="button" data-days="90">90 days</button>
      </div>
    </div>

    <div class="st-legend" aria-label="Legend">
      <span><i class="st-sw st-good"></i>Operational</span>
      <span><i class="st-sw st-warn"></i>Degraded</span>
      <span><i class="st-sw st-serious"></i>Partial outage</span>
      <span><i class="st-sw st-crit"></i>Major outage</span>
      <span><i class="st-sw st-none"></i>No data</span>
    </div>

    <div class="st-list" id="stList"></div>

    <h2 class="st-inc-h">Past incidents</h2>
    <div class="st-inc" id="stInc"></div>

    <p class="st-sub">Something not working that is not listed here? <a href="/contact-us">Tell us</a>.</p>
  </div>
</section>

<div class="st-tip" id="stTip" role="tooltip" hidden></div>

<div id="site-footer"></div>

<script src="/assets/js/icons.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/status.js"></script>
</body>
</html>
