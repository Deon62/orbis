<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Verification · orbisflow</title>
<meta name="description" content="Identity and address checks.">
<meta name="theme-color" content="#1C1C1C">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin>
<link rel="preload" as="script" href="/assets/js/app.js">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem("orbisflow-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="verification" data-nav="account" data-title="Verification" data-tabbar="hide" data-shell="app">

<div id="site-header"></div>

<main class="wrap page-body">
  <div class="stack" style="max-width:720px">
    <div class="card card-flat">
      <div class="row-line">
        <div><b>Proof of identity</b><span>National ID, passport or driving licence</span></div>
        <span class="tag tag-up"><i data-lucide="check" class="i-sm"></i>Verified</span>
      </div>
      <div class="row-line">
        <div><b>Proof of address</b><span>Utility bill or bank statement, last 3 months</span></div>
        <button class="btn btn-primary btn-sm" data-mock="Document upload"><i data-lucide="upload" class="i-sm"></i>Upload</button>
      </div>
      <div class="row-line">
        <div><b>Financial assessment</b><span>Required for real-money trading</span></div>
        <button class="btn btn-ghost btn-sm" data-mock="Financial assessment">Start</button>
      </div>
      <div class="row-line">
        <div><b>Tax residency</b><span>Declared 12 Sep 2026</span></div>
        <span class="tag tag-up"><i data-lucide="check" class="i-sm"></i>Submitted</span>
      </div>
    </div>
  </div>
</main>

<script src="/assets/js/icons.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/modals.js"></script>
</body>
</html>
