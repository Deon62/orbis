<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Price alerts · orbisflow</title>
<meta name="description" content="Get told when a market hits your level.">
<meta name="theme-color" content="#1C1C1C">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem("orbisflow-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="price-alerts" data-title="Price alerts" data-tabbar="hide" data-shell="app">

<div id="site-header"></div>

<main class="wrap page-body">
  <div class="card card-flat"><div class="row-line"><div><b>EUR/USD</b><span>Price rises above 1.0900</span></div><span class="tag tag-up">Active</span></div><div class="row-line"><div><b>BTC/USD</b><span>Price falls below 65,000.00</span></div><span class="tag tag-up">Active</span></div><div class="row-line"><div><b>XAU/USD</b><span>Price rises above 2,350.00</span></div><span class="tag tag-wait">Paused</span></div><div class="row-line"><div><b>US 100</b><span>Daily change exceeds 1.5%</span></div><span class="tag tag-down">Triggered</span></div></div>

  <div class="center-action">
    <button class="btn btn-primary" data-mock="New alert">
      <i data-lucide="plus" class="i-sm"></i>New alert
    </button>
  </div>
</main>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="/assets/js/chart.js"></script>
<script src="/assets/js/data.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/modals.js"></script>

</body>
</html>
