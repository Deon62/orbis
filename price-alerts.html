<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Price alerts · orbisflow</title>
<meta name="description" content="Get told when a market hits your level.">
<meta name="theme-color" content="#1C1C1C">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin>
<link rel="preload" as="script" href="/assets/js/app.js">
<link rel="preload" as="script" href="/assets/js/data.js">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem("orbisflow-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="price-alerts" data-title="Price alerts" data-tabbar="hide" data-shell="app">

<div id="site-header"></div>

<main class="wrap page-body">
  <div class="card card-flat" id="alertList"></div>
</main>

<script src="/assets/js/icons.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/chart.js"></script>
<script src="/assets/js/data.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/qr.js"></script>
<script src="/assets/js/modals.js"></script>

<script>
(function () {
  var A = OrbisAPI, M = A.money;

  var NEW = '<button class="btn btn-primary btn-sm" data-mock="New alert"><i data-lucide="plus" class="i-sm"></i>New alert</button>';
  A.load({
    el: '#alertList', path: '/alerts',
    empty: { icon: 'bell-ring', title: 'No price alerts',
      text: 'Pick a market and a price, and we will tell you the moment it gets there.', action: NEW },
    render: function (d) {
      return d.map(function (a) {
        return '<div class="row-line"><div><b>' + a.sym + '</b><span>' + a.rule + '</span></div>' +
          '<span class="tag ' + (a.status === 'Active' ? 'tag-up' : 'tag-wait') + '">' + a.status + '</span></div>';
      }).join('') + '<div class="center-action">' + NEW + '</div>';
    }
  });
})();
</script>
</body>
</html>
