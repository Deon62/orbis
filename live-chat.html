<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live chat · orbisflow</title>
<meta name="description" content="Talk to support.">
<meta name="theme-color" content="#1C1C1C">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin>
<link rel="preload" as="script" href="/assets/js/app.js">
<link rel="preload" as="script" href="/assets/js/data.js">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem("orbisflow-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="live-chat" data-title="Live chat" data-tabbar="hide"
      data-hdr-person-img="/assets/img/support.png" data-hdr-person-name="Support" data-hdr-person-status="Online"
      data-shell="app">

<div id="site-header"></div>

<main class="wrap page-body">
  <div class="chat">
    <div class="chat-log" id="chatLog"></div>
    <form class="composer" id="chatForm">
      <input class="input" placeholder="Write a message" aria-label="Message" autocomplete="off" maxlength="2000">
      <button class="btn btn-primary" type="submit" aria-label="Send"><i data-lucide="send" class="i-sm"></i></button>
    </form>
  </div>
</main>

<script src="/assets/js/icons.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/chart.js"></script>
<script src="/assets/js/data.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/qr.js"></script>
<script src="/assets/js/modals.js"></script>

<script>
(function () {
  var A = OrbisAPI;

  var log = document.getElementById('chatLog');
  var form = document.getElementById('chatForm');
  var input = form.querySelector('input');
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function time(d) { return (d ? new Date(d) : new Date()).toTimeString().slice(0, 5); }
  function bubble(m) {
    return '<div class="bubble ' + (m.from === 'me' ? 'bubble-out' : 'bubble-in') + '"><p>' + esc(m.text) + '</p><time>' + time(m.at) + '</time></div>';
  }
  /* the assistant answers through the API (POST /support/chat); the page
     keeps the conversation and sends the recent turns with each message */
  var history = [];
  var sendBtn = form.querySelector('button');
  function down() { window.scrollTo(0, document.body.scrollHeight); }
  function say(m) { log.insertAdjacentHTML('beforeend', bubble(m)); down(); }

  say({ from: 'them', text: 'Hi, I am Orbi, the orbisflow assistant. Ask me about deposits, withdrawals, ' +
    'verification or how trading works.' });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    say({ from: 'me', text: text });
    history.push({ role: 'user', content: text });
    input.value = '';

    if (!A.connected) {
      say({ from: 'them', text: 'Chat is offline right now. Email support@orbisflow.com and the team will reply.' });
      return;
    }
    sendBtn.disabled = true;
    log.insertAdjacentHTML('beforeend', '<div class="bubble bubble-in typing" aria-label="Typing"><i></i><i></i><i></i></div>');
    down();
    A.post('/support/chat', { messages: history.slice(-12) }).then(function (r) {
      history.push({ role: 'assistant', content: r.reply });
      return r.reply;
    }, function (err) {
      history.pop();
      return (err && err.message) || 'Something went wrong. Try again in a moment.';
    }).then(function (reply) {
      var t = log.querySelector('.typing'); if (t) t.remove();
      say({ from: 'them', text: reply });
      sendBtn.disabled = false;
      input.focus();
    });
  });
})();
</script>
</body>
</html>
