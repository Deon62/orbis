<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live chat · orbisflow</title>
<meta name="description" content="Talk to support.">
<meta name="theme-color" content="#1C1C1C">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin>
<link rel="preload" as="script" href="/assets/js/app.js">
<link rel="preload" as="script" href="/assets/js/data.js">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem("orbisflow-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body data-page="live-chat" data-title="Live chat" data-tabbar="hide"
      data-hdr-person-img="/assets/img/support.png" data-hdr-person-name="Support" data-hdr-person-status="Online"
      data-shell="app">

<div id="site-header"></div>

<main class="wrap page-body">
  <div class="chat">
    <div class="chat-log" id="chatLog"></div>
    <form class="composer" id="chatForm">
      <input class="input" placeholder="Write a message" aria-label="Message">
      <button class="btn btn-primary" type="submit" aria-label="Send"><i data-lucide="send" class="i-sm"></i></button>
    </form>
  </div>
</main>

<script src="/assets/js/icons.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/chart.js"></script>
<script src="/assets/js/data.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/qr.js"></script>
<script src="/assets/js/modals.js"></script>

<script>
(function () {
  var A = OrbisAPI, M = A.money;

  var log = document.getElementById('chatLog');
  var form = document.getElementById('chatForm');
  var input = form.querySelector('input');
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function time(d) { return (d ? new Date(d) : new Date()).toTimeString().slice(0, 5); }
  function bubble(m) {
    return '<div class="bubble ' + (m.from === 'me' ? 'bubble-out' : 'bubble-in') + '"><p>' + esc(m.text) + '</p><time>' + time(m.at) + '</time></div>';
  }
  var greeted = false;

  A.load({
    el: log, path: '/support/messages',
    empty: { icon: 'message-square', title: 'How can we help?',
      text: 'Write your question below and a member of the team will reply here. We are online 24/7.' },
    render: function (d) { greeted = true; return d.map(bubble).join(''); }
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    if (log.querySelector('.es')) log.innerHTML = '';
    log.insertAdjacentHTML('beforeend', bubble({ from: 'me', text: text }));
    if (!greeted) {
      greeted = true;
      log.insertAdjacentHTML('beforeend', '<p class="chat-note">Sent. The next available agent will reply here.</p>');
    }
    input.value = '';
    log.scrollTop = log.scrollHeight;
  });
})();
</script>
</body>
</html>
